name: build-icons
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: ["make_icons.py", ".github/workflows/icons.yml"]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install --quiet pillow
          python3 make_icons.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          git diff --cached --quiet || (git commit -m "build icons" && git push)
